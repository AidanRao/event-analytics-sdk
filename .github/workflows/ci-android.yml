name: Android CI
on:
  pull_request:
    paths: ['android/**', 'spec/**', 'examples/android/**', '.github/workflows/ci-android.yml']
  push:
    branches: [main]
    paths: ['android/**', 'spec/**', 'examples/android/**', '.github/workflows/ci-android.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          # Override the default list, which includes the unavailable legacy tools package.
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :sdk:testDebugUnitTest :sdk:lint :sdk:assembleRelease :sdk:publishToMavenLocal
        working-directory: android
      - run: ../../android/gradlew :app:assembleDebug :app:assembleDebugAndroidTest -PsdkVersion="$(sed -n 's/^VERSION_NAME=//p' ../../android/gradle.properties)"
        working-directory: examples/android
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Start acceptance stub
        run: python3 examples/android/test-server.py > /tmp/analytics-http.log 2>&1 &
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 26
          arch: x86_64
          target: google_apis
          script: |
            adb reverse tcp:8787 tcp:8787
            cd examples/android && ../../android/gradlew :app:connectedDebugAndroidTest -PsdkVersion="$(sed -n 's/^VERSION_NAME=//p' ../../android/gradle.properties)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-artifacts
          path: |
            android/sdk/build/outputs/aar/
            android/sdk/build/reports/
            examples/android/app/build/reports/
